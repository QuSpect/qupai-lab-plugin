name: SDK release

# On a tag sdk-vX.Y.Z: test the Lab SDK (sdk/python), build its sdist and wheel, check that the tag is the
# package's version, and publish to PyPI as qupai-lab through Trusted Publishing (OIDC): no token is stored.
# PyPI's trusted publisher for the project qupai-lab: owner QuSpect, repository qupai-lab-plugin, workflow
# sdk-release.yml, environment pypi.
on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python }}, moku ${{ matrix.moku }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.13"]
        # m.moku() with both generations of the official package (MokuOS 4.3 and earlier, 4.4 on)
        moku: ["4.3.0.1", "4.4.0.0"]
        exclude:
          - python: "3.10"  # moku 4.4.0.0 needs Python 3.11
            moku: "4.4.0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # With the official moku package (each generation), so the tests that drive it through m.moku() run too.
      - name: Test
        working-directory: sdk/python
        run: |
          python -m pip install -e . pytest "moku==${{ matrix.moku }}"
          python -m pytest -q

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build packaging
          python -m build sdk/python --outdir dist
      # The tag without its sdk-v prefix (PEP 440 normalised) must be the version of the sdist and the wheel,
      # and the build is one sdist and one pure-Python wheel.
      - name: Verify the version and the files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os
          import sys
          from pathlib import Path

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          tag = os.environ["TAG"]
          if not tag.startswith("sdk-v"):
              sys.exit(f"tag {tag!r} does not start with 'sdk-v'")
          expected = Version(tag.removeprefix("sdk-v"))
          dist = Path("dist")
          sdists, wheels = sorted(dist.glob("*.tar.gz")), sorted(dist.glob("*.whl"))
          if len(sdists) != 1 or len(wheels) != 1:
              sys.exit(f"expected one sdist and one wheel, found {[p.name for p in dist.iterdir()]}")
          name, version = parse_sdist_filename(sdists[0].name)
          wname, wversion, _, tags = parse_wheel_filename(wheels[0].name)
          if name != "qupai-lab" or wname != "qupai-lab":
              sys.exit(f"not qupai-lab: {sdists[0].name}, {wheels[0].name}")
          if version != expected or wversion != expected:
              sys.exit(f"version mismatch with tag {tag}: sdist {version}, wheel {wversion}, expected {expected}")
          if any(t.abi != "none" or t.platform != "any" for t in tags):
              sys.exit(f"not a pure-Python wheel: {wheels[0].name}")
          print(f"qupai-lab {expected}: {sdists[0].name}, {wheels[0].name}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/qupai-lab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
